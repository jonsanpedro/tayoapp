<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingPal | Digital Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #8B5CF6; --primary-bg: #0F172A; --sidebar-bg: #1E293B; --glass: rgba(255, 255, 255, 0.03); }
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--primary-bg); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        aside { width: 280px; background: var(--sidebar-bg); padding: 30px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); }
        .logo { font-weight: 700; font-size: 1.5rem; margin-bottom: 40px; background: linear-gradient(to right, #8B5CF6, #6366F1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .profile { text-align: center; background: var(--glass); padding: 20px; border-radius: 20px; margin-bottom: 30px; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        nav a { display: block; color: #94A3B8; text-decoration: none; padding: 12px; border-radius: 12px; transition: 0.3s; margin-bottom: 5px; }
        nav a:hover, nav a.active { background: rgba(139, 92, 246, 0.1); color: var(--accent); }

        /* MAIN CONTENT */
        main { flex: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top right, #1E1B4B, #0F172A); }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .search-bar { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 15px; width: 350px; color: white; }
        
        .grid { display: grid; grid-template-columns: 1fr 380px; gap: 30px; }

        /* CARDS */
        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 25px; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 0.75rem; color: #94A3B8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid #334155; padding: 12px; border-radius: 10px; color: white; margin-top: 5px; }
        .btn-ping { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-ping:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); transform: translateY(-2px); }

        /* PING LIST */
        .ping-item { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .ping-item:hover { border-color: var(--accent); }
        .ping-content b { display: block; font-size: 1.1rem; }
        .ping-content span { color: var(--accent); font-size: 0.85rem; }
        .del-btn { background: none; border: none; color: #475569; cursor: pointer; font-size: 1.2rem; }
        .del-btn:hover { color: #F87171; }
    </style>
</head>
<body>

    <aside>
        <div class="logo">PingPal.io</div>
        <div class="profile">
            <div class="avatar">JS</div>
            <div style="font-weight: 600; font-size: 0.9rem;">Jonas San Pedro</div>
            <div style="color: #64748B; font-size: 0.75rem;">BSIT Student</div>
        </div>
        <nav>
            <a href="#" class="active">🏠 Dashboard</a>
            <a href="#">📅 My Schedule</a>
            <a href="#">👥 Crew</a>
            <a href="#">⚙️ Settings</a>
        </nav>
    </aside>

    <main>
        <div class="header-actions">
            <input type="text" class="search-bar" placeholder="Search pings...">
            <div>🔔 <span style="margin-left: 15px;">Logout</span></div>
        </div>

        <div class="grid">
            <div class="left-col">
                <h2 style="margin-top:0">Recent Pings</h2>
                <div id="reminderList">
                    </div>
            </div>

            <div class="right-col">
                <div class="glass-card">
                    <h3 style="margin-top:0">New Ping 🚀</h3>
                    <div class="input-group">
                        <label>Task / Event</label>
                        <input type="text" id="taskInput" placeholder="What's happening?">
                    </div>
                    <div class="input-group">
                        <label>Tag Your Pal</label>
                        <input type="text" id="friendInput" placeholder="@username">
                    </div>
                    <button id="addBtn" class="btn-ping">Send to Crew</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
