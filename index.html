<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingPal | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #7C3AED; 
            --accent-light: #A78BFA;
            --bg-main: #0B0E14; 
            --bg-side: #11141B;
            --text-main: #F8FAFC;
            --text-dim: #94A3B8;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        /* SIDEBAR - Professional Layout */
        aside { 
            width: 280px; background: var(--bg-side); 
            padding: 40px 24px; display: flex; flex-direction: column; 
            border-right: 1px solid var(--border); 
        }
        .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 48px; color: var(--accent-light); }
        
        .user-pill { 
            background: var(--glass); border: 1px solid var(--border);
            padding: 16px; border-radius: 20px; margin-bottom: 32px;
            display: flex; align-items: center; gap: 12px;
        }
        .user-pill .avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .user-info b { display: block; font-size: 0.9rem; }
        .user-info span { font-size: 0.75rem; color: var(--text-dim); }

        nav { flex: 1; }
        nav a { 
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; color: var(--text-dim); 
            text-decoration: none; border-radius: 14px; margin-bottom: 8px; font-weight: 500;
        }
        nav a:hover, nav a.active { background: var(--glass); color: var(--text-main); border: 1px solid var(--border); }

        /* MAIN CONTENT AREA */
        main { flex: 1; padding: 48px; overflow-y: auto; background: radial-gradient(circle at 50% 0%, #1E1B4B 0%, #0B0E14 70%); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
        .search { background: var(--glass); border: 1px solid var(--border); padding: 12px 24px; border-radius: 16px; width: 400px; }
        .search input { background: none; border: none; color: white; width: 100%; outline: none; font-family: inherit; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 400px; gap: 40px; }

        /* CARDS */
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 32px; padding: 32px; backdrop-filter: blur(20px); }
        .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }

        .input-box { margin-bottom: 20px; }
        .input-box label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; display: block; margin-bottom: 8px; }
        .input-box input { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); 
            padding: 16px; border-radius: 16px; color: white; font-size: 1rem;
        }
        .input-box input:focus { border-color: var(--accent); background: rgba(0,0,0,0.5); outline: none; }

        .btn-primary { 
            width: 100%; padding: 18px; background: var(--accent); color: white; 
            border: none; border-radius: 18px; font-weight: 700; cursor: pointer; 
            box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* PING LIST - Refined */
        .ping-card { 
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            padding: 24px; border-radius: 24px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ping-card:hover { background: var(--glass); border-color: var(--accent-light); }
        .ping-content b { font-size: 1.1rem; display: block; margin-bottom: 4px; }
        .ping-tag { color: var(--accent-light); font-weight: 600; font-size: 0.85rem; background: rgba(124, 58, 237, 0.1); padding: 4px 10px; border-radius: 8px; }

        .del-btn { background: none; border: none; color: #475569; cursor: pointer; font-size: 1.5rem; }
        .del-btn:hover { color: #F87171; }
    </style>
</head>
<body>

    <aside>
        <div class="brand">PingPal</div>
        <div class="user-pill">
            <div class="avatar">JS</div>
            <div class="user-info">
                <b>Jonas San Pedro</b>
                <span>BSIT Specialist</span>
            </div>
        </div>
        <nav>
            <a href="#" class="active">Dashboard</a>
            <a href="#">Reminders</a>
            <a href="#">Friends</a>
            <a href="#">Profile</a>
        </nav>
    </aside>

    <main>
        <div class="header">
            <div class="search"><input type="text" placeholder="Search your pings..."></div>
            <div style="font-size: 1.2rem;">🔔 <span style="margin-left: 20px; font-size: 0.9rem; font-weight: 600;">Sign Out</span></div>
        </div>

        <div class="dashboard-grid">
            <div class="left-section">
                <div class="card-title">Recent Pings ⚡️</div>
                <div id="reminderList">
                    </div>
            </div>

            <div class="right-section">
                <div class="card">
                    <div class="card-title">Create New Ping</div>
                    <div class="input-box">
                        <label>Task Title</label>
                        <input type="text" id="taskInput" placeholder="What's the plan?">
                    </div>
                    <div class="input-box">
                        <label>Tag Person</label>
                        <input type="text" id="friendInput" placeholder="@username">
                    </div>
                    <button class="btn-primary" id="addBtn">Broadcast Ping</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
