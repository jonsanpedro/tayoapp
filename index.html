<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TayoApp Prototype</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #ffa000; border: none; color: white; font-weight: bold; cursor: pointer; }
        #reminderList { margin-top: 20px; }
        .card { background: #fffde7; padding: 10px; border-left: 5px solid #ffa000; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>TayoApp 🤝</h2>
        <input type="text" id="taskInput" placeholder="Anong gagawin niyo?">
        <input type="text" id="friendInput" placeholder="Sino itatag mo?">
        <button id="addBtn">Add Reminder</button>
        <div id="reminderList"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
